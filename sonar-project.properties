# SonarQube project configuration.
# The server URL and token are NOT stored here: pass them at scan time via
# SONAR_HOST_URL and SONAR_TOKEN (environment variables or CI secrets).

sonar.projectKey=website
sonar.projectName=Website
sonar.sourceEncoding=UTF-8

# Sources and tests
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.ts,tests/**/*.js
sonar.exclusions=**/node_modules/**,dist/**,coverage/**,**/*.d.ts,**/*.backup.*

# Coverage (generated by `npm run test:ci`)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Keep the coverage denominator aligned with `collectCoverageFrom` in
# jest.config.js: thin view wrappers, App.vue, main.ts, locales, assets and
# interfaces are intentionally outside the coverage scope.
sonar.coverage.exclusions=src/views/**,src/App.vue,src/main.ts,src/locales/**,src/assets/**,src/interfaces/**,src/shims-vue.d.ts,tests/**
